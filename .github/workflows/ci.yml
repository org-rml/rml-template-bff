name: CI/CD — rml-bff-BFF_PROJECT

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  IMAGE: ghcr.io/org-rml/rml-bff-br.com.BFF_PROJECT

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven settings (Nexus)
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>rml-nexus-group</id>
                <username>${{ secrets.NEXUS_USER }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
            <repositories>
              <repository>
                <id>rml-nexus-group</id>
                <url>${{ secrets.NEXUS_URL }}/repository/rml-group/</url>
                <releases><enabled>true</enabled></releases>
                <snapshots><enabled>true</enabled></snapshots>
              </repository>
            </repositories>
          </settings>
          EOF

      - name: Build e testes
        run: mvn --batch-mode clean verify -Dnexus.url=${{ secrets.NEXUS_URL }}
        if: ${{ vars.NEXUS_ENABLED == 'true' }}

      - name: Build (sem Nexus)
        run: mvn --batch-mode clean compile -Dnexus.url=http://localhost:8082 || true
        if: ${{ vars.NEXUS_ENABLED != 'true' }}

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrai metadata da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy-staging:
    needs: docker
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: org-rml/rml-bff-BFF_PROJECT-config
          ref: staging
          token: ${{ secrets.CONFIG_REPO_TOKEN }}

      - name: Bump values-version.yaml — STAGING
        run: |
          TAG=${{ needs.docker.outputs.image_tag }}
          sed -i "s|tag:.*|tag: \"${TAG}\"|" values-version.yaml
          git config user.email "ci@org-rml.com"
          git config user.name "CI Bot"
          git commit -am "ci(staging): bump image to ${TAG}"
          git push

  deploy-sandbox:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: sandbox
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: org-rml/rml-bff-BFF_PROJECT-config
          ref: sandbox
          token: ${{ secrets.CONFIG_REPO_TOKEN }}

      - name: Bump values-version.yaml — SANDBOX
        run: |
          TAG=${{ needs.docker.outputs.image_tag }}
          sed -i "s|tag:.*|tag: \"${TAG}\"|" values-version.yaml
          git config user.email "ci@org-rml.com"
          git config user.name "CI Bot"
          git commit -am "ci(sandbox): bump image to ${TAG}"
          git push

  deploy-production:
    needs: deploy-sandbox
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: org-rml/rml-bff-BFF_PROJECT-config
          ref: production
          token: ${{ secrets.CONFIG_REPO_TOKEN }}

      - name: Bump values-version.yaml — PRODUCTION
        run: |
          TAG=${{ needs.docker.outputs.image_tag }}
          sed -i "s|tag:.*|tag: \"${TAG}\"|" values-version.yaml
          git config user.email "ci@org-rml.com"
          git config user.name "CI Bot"
          git commit -am "ci(production): bump image to ${TAG}"
          git push
