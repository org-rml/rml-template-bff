name: CI/CD — rml-bff-BFF_PROJECT

on:
  push:
    branches: [ main, homolog ]
  pull_request:
    branches: [ main, homolog ]
  workflow_dispatch:
    inputs:
      acao:
        description: O que deseja fazer?
        required: true
        default: Somente Build
        type: choice
        options:
          - Somente Build
          - Build + Deploy
          - Atualizacao values.yaml

env:
  IMAGE: ghcr.io/org-rml/rml-bff-br.com.BFF_PROJECT

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Show manual options
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "acao=${{ inputs.acao }}"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven


      - name: Build e testes
        run: mvn --batch-mode dependency:go-offline clean verify

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.acao == 'Build + Deploy')
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrai metadata da imagem
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
          secrets: |
            packages_token=${{ secrets.PACKAGES_TOKEN }}

  deploy-homolog:
    needs: docker
    runs-on: ubuntu-latest
    environment: homolog
    if: github.ref == 'refs/heads/homolog'
    steps:
      - uses: actions/checkout@v5
        with:
          repository: org-rml/rml-bff-BFF_PROJECT-config
          ref: homolog
          token: ${{ secrets.CONFIG_REPO_TOKEN }}

      - name: Bump values-version.yaml — HOMOLOG
        run: |
          TAG=${{ needs.docker.outputs.image_tag }}
          sed -i "s|tag:.*|tag: \"${TAG}\"|" values-version.yaml
          git config user.email "ci@org-rml.com"
          git config user.name "CI Bot"
          git commit -am "ci(homolog): bump image to ${TAG}"
          git push

  deploy-production:
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
        with:
          repository: org-rml/rml-bff-BFF_PROJECT-config
          ref: main
          token: ${{ secrets.CONFIG_REPO_TOKEN }}

      - name: Bump values-version.yaml — MAIN
        run: |
          TAG=${{ needs.docker.outputs.image_tag }}
          sed -i "s|tag:.*|tag: \"${TAG}\"|" values-version.yaml
          git config user.email "ci@org-rml.com"
          git config user.name "CI Bot"
          git commit -am "ci(main): bump image to ${TAG}"
          git push
